name: Release

# push main 即发布（Setup 安装包是唯一发行形式）。
on:
  workflow_dispatch:
  push:
    branches:
      - main

# The release job creates a tag and a release — it needs write access, which the
# default GITHUB_TOKEN does not carry.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Inno Setup 6 is preinstalled on the runner image, but installing the package keeps
      # ISCC.exe guaranteed at one of the paths build.ps1 probes.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # The one canonical packager: single-file self-contained exe into dist\win-x64, then
      # Inno Setup compiles dist\installer\DeskCanvas-<version>-x64-Setup.exe.
      # The Setup installer is the ONLY distribution form — no portable zip, no MSI.
      - name: Package Setup
        shell: powershell
        run: .\build.ps1 -Setup

      - name: Get Assembly Version
        id: version
        run: |
          $filePath = ".\src\DeskCanvas\AssemblyInfo.cs"
          $content = [string](Get-Content $filePath)

          if ($content -match '\[assembly: AssemblyVersion\("([0-9]+\.[0-9]+\.[0-9]+)"\)\]') {
            $version = $matches[1]
            echo "Assembly Version: $version"
            echo "version=v$version" >> $env:GITHUB_OUTPUT
          } else {
            echo "AssemblyVersion not found in $filePath"
            exit 1
          }

      - name: Create Tag
        uses: negz/create-tag@v1
        with:
          version: ${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version }}

      - name: Create Release (Setup only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: DeskCanvas ${{ steps.version.outputs.version }}
          body: |
            # Changelog:
            ${{ steps.changelog.outputs.changes }}
          files: dist/installer/DeskCanvas-*-Setup.exe
          fail_on_unmatched_files: true
