name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

# The release job creates a tag and a release, and update-docs pushes to the wiki —
# both need write access, which the default GITHUB_TOKEN does not carry.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Inno Setup 6 is preinstalled on the runner image, but installing the package keeps
      # ISCC.exe guaranteed at one of the paths build.ps1 probes.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build solution
        run: dotnet build .\src\DeskCanvas.sln --configuration Release

      # The one canonical packager: single-file self-contained exe into dist\win-x64, then
      # Inno Setup compiles dist\installer\DeskCanvas-<version>-x64-Setup.exe.
      # The Setup installer is the ONLY distribution form — no portable zip, no MSI.
      - name: Package Setup
        shell: powershell
        run: .\build.ps1 -Setup

      - name: Upload docs input
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .\src\DeskCanvas\bin\Release\net10.0

      - name: Get Assembly Version
        id: version
        run: |
          $filePath = ".\src\DeskCanvas\AssemblyInfo.cs"
          $content = [string](Get-Content $filePath)

          if ($content -match '\[assembly: AssemblyVersion\("([0-9]+\.[0-9]+\.[0-9]+)"\)\]') {
            $version = $matches[1]
            echo "Assembly Version: $version"
            echo "version=v$version" >> $env:GITHUB_OUTPUT
          } else {
            echo "AssemblyVersion not found in $filePath"
            exit 1
          }

      - name: Create Tag
        uses: negz/create-tag@v1
        with:
          version: ${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version }}

      - name: Create Release (Setup only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: DeskCanvas ${{ steps.version.outputs.version }}
          body: |
            # Changelog:
            ${{ steps.changelog.outputs.changes }}
          files: dist/installer/DeskCanvas-*-Setup.exe
          fail_on_unmatched_files: true

  update-docs:
    runs-on: windows-latest
    needs: release

    steps:
      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install tool
        run: dotnet tool install -g XMLDoc2Markdown

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build
          path: .

      - name: Run tool
        run: |
          ls .
          ls .\build
          xmldoc2md .\build\DeskCanvas.Core.dll `
          --output .\new-wiki\API `
          --platform github-pages `
          --index-page-name API `

      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{github.repository}}.wiki
          path: wiki

      - name: Update API docs
        run: |
          if (Test-Path -Path wiki\API) { Remove-Item -Recurse -Force wiki\API }
          New-Item -ItemType Directory -Path wiki\API
          Copy-Item -Path new-wiki\API\* -Destination wiki\API -Recurse

      - name: Commit & Push changes
        run: |
          cd wiki
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update API docs"
          git push
